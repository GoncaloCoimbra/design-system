default:
  image: node:22-alpine
  before_script:
    - npm ci --legacy-peer-deps

stages:
  - check
  - release

# ─── CHECK (runs on every push) ─────────────────────────────────────────────

typecheck:
  stage: check
  script:
    - npm run typecheck
  rules:
    - when: always

lint:
  stage: check
  script:
    - npm run lint
  rules:
    - when: always

format:
  stage: check
  script:
    - npm run format:check
  rules:
    - when: always

test:
  stage: check
  script:
    - npm run test:coverage
  coverage: '/^All files\s*\|\s*[\d.]+/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 1 week
  rules:
    - when: always

build:
  stage: check
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  rules:
    - when: always

# ─── RELEASE (triggered manually on main) ────────────────────────────────────
# Before triggering these jobs, run locally:
#   npm run changeset   → record what changed
#   npm run version     → bump package.json + update CHANGELOG.md
#   git commit -am "chore: release vX.Y.Z" && git push

release:
  stage: release
  script:
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm run build
    - npx changeset publish
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  environment:
    name: npm
